[project]
name = "human-vs-ai-text-analysis"
version = "0.1.0"
description = "Sparse probing and activation patching of AI-text detection neurons in frozen BERT (EMNLP 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Paweł Blicharz"},
    {name = "Miłosz Grunwald"},
]
keywords = ["nlp", "bert", "interpretability", "ai-text-detection", "sparse-probing", "activation-patching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core: frozen BERT activation extraction
    # For GPU support install PyTorch with CUDA first, e.g.:
    #   uv sync && uv pip install torch --torch-backend=cu124
    # The default install below is CPU-only (much slower for activation extraction).
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.0.0",
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Probing, selection, evaluation
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    # Figures
    "matplotlib>=3.7.0",
    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Gradient-PG/ai-text-detection-neurons"
Repository = "https://github.com/Gradient-PG/ai-text-detection-neurons"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["raid_pipeline", "raid_analysis"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["raid_pipeline", "raid_analysis"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

